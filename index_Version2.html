<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Joke Generator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(520px, 100%);
      padding: 36px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 50px #19284a18;
    }

    .emoji { font-size: 3rem; }

    h1 { margin: 12px 0; }

    #joke {
      min-height: 100px;
      margin: 24px 0;
      color: #46516a;
      font-size: 1.15rem;
      line-height: 1.65;
    }

    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 10px;
      background: #5b5ce2;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #4849c8; }
    button:disabled { opacity: .65; cursor: wait; }

    .status {
      min-height: 24px;
      margin-top: 14px;
      color: #68728a;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">😂</div>
    <h1>Random Joke Generator</h1>
    <p id="joke" aria-live="polite">Click the button for a joke!</p>
    <button id="joke-button" type="button">Tell me a joke</button>
    <div class="status" id="status" role="status"></div>
  </main>

  <script>
    const jokeElement = document.querySelector("#joke");
    const button = document.querySelector("#joke-button");
    const statusElement = document.querySelector("#status");

    async function getJoke() {
      button.disabled = true;
      button.textContent = "Loading…";
      statusElement.textContent = "";

      try {
        const response = await fetch(
          "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
          throw new Error("The joke service is unavailable.");
        }

        const joke = await response.json();
        jokeElement.textContent = `${joke.setup} — ${joke.punchline}`;
      } catch {
        jokeElement.textContent = "Couldn't fetch a joke right now. Please try again.";
        statusElement.textContent = "Check your internet connection and try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Tell me another";
      }
    }

    button.addEventListener("click", getJoke);
  </script>
</body>
</html>
